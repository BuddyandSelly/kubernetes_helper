name: Create release from tag
on:
  push:
    tags: # Create a release once a git tag is published
      - '*'

jobs:
  release-builder:
    # BuddyandSelly, not ReverseRetail. ReverseRetail is this organisation's former name
    # on GitHub and every other reference to it still resolves, because git and the API
    # follow the rename redirect. Actions does not follow it for a `uses:` reference: the
    # run fails the moment it starts, with no jobs and no log to read. That is what broke
    # the v1.25.0 release, and why nothing has been released here since the rename.
    uses: BuddyandSelly/reusable-ci-cd-actions/.github/workflows/release_builder_from_tag.yml@main
    with:
      commit_mode: true
