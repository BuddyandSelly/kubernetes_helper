documents:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: &app_name <%=deployment.name%>
    spec:
      replicas: <%=deployment.replicas%>
      selector:
        matchLabels:
          name: *app_name
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      minReadySeconds: 10
      template:
        metadata:
          labels:
            name: *app_name
        spec: &template_spec
          containers:
            - &app_container
              image: '<%= continuous_deployment.image_name %>:<%= ENV['DEPLOY_IMAGE_TAG'] || continuous_deployment.image_tag || "latest" %>'
              <% if deployment.command %>
              command: ["/bin/bash", "-c", "<%= deployment.command %>"]
              <% end %>
              name: *app_name

              static_env: true
              <% if secrets.import_all_secrets %>
              envFrom:
              - secretRef:
                  name: <%= secrets.name %>
              <% else %>
              import_secrets: ['secrets.yml', '<%=secrets.name%>']
              <% end %>

              ports:
                - containerPort: &port <%= deployment.app_port || 3000 %>
                  name: '<%=service.backend_port_name || 'b-port'%>'

              <% if deployment.liveness_path %>
              livenessProbe: &liveness_probe
                httpGet:
                  path: <%=deployment.liveness_path%>
                  port: *port
                initialDelaySeconds: 50
                timeoutSeconds: 3
                periodSeconds: 15
              readinessProbe: *liveness_probe
              <% end %>
              <% if deployment.resources %>
              <%= include_template "_resources.yml", deployment.resources %>
              <% end %>
              <%= include_template "_container_extra_settings.yml", { pod: 'web' } %>

              volumeMounts:
                <% if deployment.log_container %>
                - &log_volume
                  name: applog
                  mountPath: <%= deployment.log_folder %>
                <% end %>

                <% if deployment.cloud_secret_name %>
                - &cloud_credentials_volume
                  name: gcloud-creds
                  mountPath: /secrets/gcloud
                  readOnly: true
                <% end %>

                <% (deployment.custom_volumes || {}).each do |name, vol| %>
                - name: <%= name %>
                  mountPath: <%= vol[:mount_path] %>
                <% end %>

            <% if deployment.cloud_secret_name %>
            <%
              # v2 takes each instance as a positional argument with its port as a query
              # parameter, where v1 took them all in one -instances flag as
              # "project:region:instance=tcp:3306". Translated here so that cloud_sql_instance
              # keeps its existing shape in every app's settings.rb and nothing has to change
              # in lockstep with this template. A comma separated list still works, and an
              # entry with no =tcp: port is passed through as it is.
              cloud_sql_instances = deployment.cloud_sql_instance.to_s.split(',').map do |entry|
                name, port = entry.strip.split('=tcp:')
                port.to_s.empty? ? name : "#{name}?port=#{port}"
              end
            %>
            - &cloudsql_container
              # The v1 proxy (gcr.io/cloudsql-docker/gce-proxy) checked the server certificate
              # by matching its CN against the literal "project:instance" string. Cloud SQL
              # serves DNS name certificates now (<n>-<uuid>.<region>.sql.goog), so that check
              # cannot pass any more and every v1 proxy fails the TLS handshake with
              #   x509: certificate is valid for ...sql.goog, not project:instance
              # which reaches the app as "Lost connection to server at 'handshake: reading
              # initial communication packet'". The v1 image repository is frozen as well: its
              # only remaining tags are no-new-use-public-image-*.
              image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
              name: cloudsql-proxy
              # args, not command: v2 ships its own entrypoint.
              args: ["--credentials-file=/secrets/gcloud/credentials.json",
                     <%= cloud_sql_instances.map { |instance| "\"#{instance}\"" }.join(",\n                     ") %>]
              env: []
              volumeMounts:
                - *cloud_credentials_volume
              <%= include_template "_resources.yml", deployment.cloudsql_resources || { cpu: { min: '1' }, mem: { min: '1Gi' } } %>
              <%= include_template "_container_extra_settings.yml", { pod: 'cloudsql' } %>
            <% end %>

            <% if deployment.log_container %>
            - &logs_container # print to stdout all log files
              name: print-logs
              image: busybox
              command: [/bin/sh, -c, 'until find <%= deployment.log_folder %>/*.log; do sleep 5; done; tail -n+1 -f <%= deployment.log_folder %>/*.log']
              env: []
              volumeMounts:
                - *log_volume
              <%= include_template "_resources.yml", deployment.logs_resources || { cpu: { max: '300m', min: '100m' }, mem: { max: '500Mi', min: '200Mi' } } %>
              <%= include_template "_container_extra_settings.yml", { pod: 'logs' } %>
            <% end %>

            <%= include_template "_custom_containers.yml", { pod: 'web' } %>

          terminationGracePeriodSeconds: <%= deployment.termination_grace_period_seconds || 120 %>
          volumes:
            <%= include_template "_volumes.yml", { pod: 'web' } %>

  <% deployment.job_apps.each do |job_app| %>
  <%= include_template '_jobs_pod.yml', job_app: job_app if job_app[:kind] != 'CronJob' %>
  <%= include_template '_cronjobs_pod.yml', job_app: job_app if job_app[:kind] == 'CronJob' %>
  <% end %>

  <% if deployment.replicas_range %>
  <%= include_template "_replicas.yml" %>
  <% end %>
